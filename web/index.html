<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sawad loan application">
  <!-- Embedded inside a native WebView; let it fill the host and avoid zoom. -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Sawad Loan">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Sawad Loan</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    pdf.js — required by `pdfx`, which renders the contract PDFs on step 6.

    Android System WebView has **no PDF plugin**, so the previous
    `<iframe src="blob:...">` viewer drew a blank frame there (desktop browsers
    and iOS WKWebView were fine). pdf.js decodes the file in JavaScript and
    paints pages to a canvas, so it needs nothing from the embedder.

    Version, URLs and the cMap options mirror the LandAndHouseWeb top-up flow,
    which renders its own contract PDFs this way inside the same WebView — this
    is a copy of a configuration already proven on these devices.

    `cMapUrl`/`cMapPacked` are **not optional here**: the documents are Thai, and
    without the character maps pages render blank of text even though the file
    loaded fine.

    TODO: self-host these three files under `web/` so a contract cannot fail to
    display because a third-party CDN is unreachable.
  -->
  <script src='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.min.mjs' type='module'></script>
  <script type='module'>
    var { pdfjsLib } = globalThis;
    pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.worker.mjs';

    var pdfRenderOptions = {
      cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/cmaps/',
      cMapPacked: true,
    }
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
